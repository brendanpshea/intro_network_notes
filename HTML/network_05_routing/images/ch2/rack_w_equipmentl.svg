<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <linearGradient id="metal-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2b2b2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="server-bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    
    <rect id="rj45-port" width="20" height="20" rx="2" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <rect id="power-outlet" width="22" height="22" rx="3" fill="#000" stroke="#444" stroke-width="1"/>
    <circle id="led-green" cx="5" cy="5" r="2" fill="#0f0"/>
    <circle id="led-amber" cx="5" cy="5" r="2" fill="#fa0"/>
  </defs>

  <rect width="900" height="750" fill="#f8f8f8"/>

  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="30" height="680" fill="#333" rx="2"/> <rect x="470" y="0" width="30" height="680" fill="#333" rx="2"/> <g fill="#111">
      <circle cx="15" cy="50" r="3"/><circle cx="15" cy="150" r="3"/>
      <circle cx="15" cy="250" r="3"/><circle cx="15" cy="350" r="3"/>
      <circle cx="15" cy="450" r="3"/><circle cx="15" cy="550" r="3"/>
      <circle cx="15" cy="650" r="3"/>
      
      <circle cx="485" cy="50" r="3"/><circle cx="485" cy="150" r="3"/>
      <circle cx="485" cy="250" r="3"/><circle cx="485" cy="350" r="3"/>
      <circle cx="485" cy="450" r="3"/><circle cx="485" cy="550" r="3"/>
      <circle cx="485" cy="650" r="3"/>
    </g>
  </g>

  <g transform="translate(80, 0)">

    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="440" height="40" fill="#222" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="5" width="10" height="30" fill="#333"/> <rect x="440" y="5" width="10" height="30" fill="#333"/> <g transform="translate(40, 9)">
        <use href="#power-outlet" x="0"/><use href="#power-outlet" x="40"/>
        <use href="#power-outlet" x="80"/><use href="#power-outlet" x="120"/>
        <use href="#power-outlet" x="160"/><use href="#power-outlet" x="200"/>
        <use href="#power-outlet" x="240"/><use href="#power-outlet" x="280"/>
      </g>
      <text x="380" y="25" font-family="Arial" font-size="10" fill="#aaa">PDU Output</text>
    </g>

    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="440" height="50" fill="url(#metal-gradient)" stroke="#000" stroke-width="2"/>
      <rect x="-10" y="5" width="10" height="40" fill="#333"/>
      <rect x="440" y="5" width="10" height="40" fill="#333"/>
      <g transform="translate(20, 15)">
        <use href="#rj45-port" x="0"/><use href="#rj45-port" x="25"/>
        <use href="#rj45-port" x="50"/><use href="#rj45-port" x="75"/>
        <use href="#rj45-port" x="100"/><use href="#rj45-port" x="125"/>
        <use href="#rj45-port" x="150"/><use href="#rj45-port" x="175"/>
        <use href="#rj45-port" x="200"/><use href="#rj45-port" x="225"/>
        <use href="#rj45-port" x="250"/><use href="#rj45-port" x="275"/>
      </g>
      <rect x="20" y="5" width="300" height="6" fill="#fff" opacity="0.7"/> </g>

    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="440" height="50" fill="#2c3e50" stroke="#000" stroke-width="2"/>
      <rect x="-10" y="5" width="10" height="40" fill="#333"/>
      <rect x="440" y="5" width="10" height="40" fill="#333"/>
      <g transform="translate(100, 15)">
        <use href="#rj45-port" x="0"/><use href="#rj45-port" x="25"/>
        <use href="#rj45-port" x="50"/><use href="#rj45-port" x="75"/>
        <use href="#rj45-port" x="100"/><use href="#rj45-port" x="125"/>
        <use href="#rj45-port" x="150"/><use href="#rj45-port" x="175"/>
        <use href="#rj45-port" x="200"/><use href="#rj45-port" x="225"/>
        <use href="#rj45-port" x="250"/><use href="#rj45-port" x="275"/>
      </g>
      <g transform="translate(10, 10)">
        <use href="#led-green"/><use href="#led-green" x="10"/><use href="#led-amber" x="20"/>
      </g>
      <text x="10" y="40" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">Gigabit Switch</text>
    </g>

    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="440" height="90" fill="url(#server-bezel)" stroke="#000" stroke-width="2"/>
      <rect x="-10" y="5" width="10" height="80" fill="#333"/>
      <rect x="440" y="5" width="10" height="80" fill="#333"/>
      <g transform="translate(20, 10)" fill="#222" stroke="#444">
        <rect width="60" height="70"/><rect x="70" width="60" height="70"/>
        <rect x="140" width="60" height="70"/><rect x="210" width="60" height="70"/>
      </g>
      <g transform="translate(300, 15)">
        <rect x="0" y="0" width="120" height="60" fill="#111" stroke="#333" rx="2"/>
        <text x="10" y="20" font-family="Arial" font-size="10" fill="#888">FILE-SRV-01</text>
        <circle cx="100" cy="15" r="5" fill="#0f0" stroke="#0a0"/> <g transform="translate(10, 40)"><use href="#led-green"/><use href="#led-green" x="15"/><use href="#led-amber" x="30"/></g>
        <use href="#rj45-port" x="80" y="35"/> </g>
    </g>

  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <g stroke="#111" stroke-width="5" opacity="0.9">
      <path d="M 120,69 C 120,150 40,150 40,275 L 80,275" stroke-dasharray="2,1"/>
      <path d="M 160,69 C 160,150 -20,200 -20,445 L 80,445" stroke-dasharray="2,1"/>
    </g>

    <g stroke="#3498db" stroke-width="3">
      <path d="M 100,135 C 100,200 180,200 180,265"/>
      <path d="M 125,135 C 125,205 205,205 205,265"/>
      <path d="M 150,135 C 150,210 230,210 230,265"/>
      <path d="M 175,135 C 175,215 255,215 255,265"/>
      <path d="M 200,135 C 200,220 280,220 280,265"/>
      <path d="M 225,135 C 225,225 305,225 305,265"/>
      <path d="M 250,135 C 250,230 350,200 350,265"/>
      <path d="M 275,135 C 275,235 380,200 380,265"/>
    </g>

    <g stroke="#e67e22" stroke-width="3">
      <path d="M 330,265 C 330,350 380,350 390,435"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#333">
    
    <g transform="translate(550, 0)">
      <line x1="-20" y1="70" x2="50" y2="70" stroke="#999" stroke-width="1"/>
      <circle cx="-20" cy="70" r="3" fill="#999"/>
      <text x="60" y="65" font-weight="bold" font-size="14">POWER DISTRIBUTION UNIT (PDU)</text>
      <text x="60" y="85" font-size="12">Distributes electrical power to rack devices.</text>

      <line x1="-20" y1="145" x2="50" y2="145" stroke="#999" stroke-width="1"/>
      <circle cx="-20" cy="145" r="3" fill="#999"/>
      <text x="60" y="140" font-weight="bold" font-size="14">PATCH PANEL</text>
      <text x="60" y="160" font-size="12">Termination point for building cable runs.</text>

      <line x1="-20" y1="275" x2="50" y2="275" stroke="#999" stroke-width="1"/>
      <circle cx="-20" cy="275" r="3" fill="#999"/>
      <text x="60" y="270" font-weight="bold" font-size="14">NETWORK SWITCH</text>
      <text x="60" y="290" font-size="12">Connects devices and manages data traffic.</text>

      <line x1="-20" y1="445" x2="50" y2="445" stroke="#999" stroke-width="1"/>
      <circle cx="-20" cy="445" r="3" fill="#999"/>
      <text x="60" y="440" font-weight="bold" font-size="14">SERVER (e.g., File Server)</text>
      <text x="60" y="460" font-size="12">Computer that provides services or data.</text>
    </g>

    <g font-size="12">
      <text x="60" y="350" fill="#111" font-weight="bold" transform="rotate(-90 60,350)">POWER CABLES</text>
      
      <g transform="translate(220, 200)">
         <rect x="-5" y="-15" width="110" height="20" fill="#fff" opacity="0.8" rx="4"/>
         <text x="0" y="0" fill="#3498db" font-weight="bold">PATCH CABLES</text>
      </g>
      
      <g transform="translate(340, 370)">
         <rect x="-5" y="-15" width="100" height="20" fill="#fff" opacity="0.8" rx="4"/>
         <text x="0" y="0" fill="#e67e22" font-weight="bold">SERVER UPLINK</text>
      </g>
    </g>
  </g>
</svg>